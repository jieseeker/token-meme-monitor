<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5f59">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Alpha 雷达</title>
<style>
:root {
  --bg: #f5f7f4; --panel: #fffefa;
  --line: rgba(23,32,51,.10); --line-strong: rgba(15,118,110,.22);
  --text: #111827; --muted: #5f6b76; --subtle: #64707c;
  --accent: #0f766e; --accent-strong: #0b5f59; --accent-soft: #e6f4f1;
  --accent-wash: rgba(15,118,110,.08); --risk: #b45309; --danger: #ef4444;
  --shadow-card: 0 1px 2px rgba(17,24,39,.035);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','SF Pro','Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

.top-bar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:12px 28px; border-bottom:1px solid var(--line); }
.brand-lockup { display:flex; align-items:center; gap:12px; }
.brand-mark { flex:none; width:38px; height:38px; }
.toolbar-title { font-size:22px; font-weight:850; letter-spacing:-.3px; }
.toolbar-subtitle { margin-top:3px; font-size:12px; color:var(--muted); }
.top-right { display:flex; align-items:center; gap:14px; white-space:nowrap; }
.token-count { padding-right:14px; border-right:1px solid var(--line); font-size:12px; color:var(--muted); }
.refresh-badge { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.refresh-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
.notify-toggle { flex:0 0 auto; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:13px; color:var(--muted); cursor:pointer; }
.notify-toggle.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
.history-panel { position:fixed; z-index:80; right:20px; top:78px; width:min(760px,calc(100vw - 32px)); max-height:min(520px,calc(100vh - 100px)); overflow:auto; padding:16px 18px; border:1px solid var(--line-strong); border-radius:14px; background:var(--panel); box-shadow:0 18px 48px rgba(15,23,42,.22); }
.history-panel[hidden] { display:none; }
.history-table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
.history-table th,.history-table td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
.history-table th:first-child,.history-table td:first-child { text-align:left; }
.history-table th { color:var(--muted); font-weight:650; }
@media(max-width:600px){ .top-bar { align-items:flex-start; flex-direction:column; gap:10px; padding:12px 14px; } .toolbar-subtitle { line-height:1.5; } .top-right { flex-wrap:wrap; row-gap:8px; } }

.main { display:grid; grid-template-columns:minmax(260px,300px) minmax(0,1fr); gap:20px; padding:20px 24px 40px; max-width:118rem; margin:auto; }

/* ============ LEFT: Token List ============ */
.list-panel { display:flex; flex-direction:column; gap:12px; position:sticky; top:20px; align-self:start; max-height:calc(100vh - 40px); padding:16px 20px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
.section-title { font-size:20px; font-weight:750; letter-spacing:-.2px; }
.filter-row { display:flex; align-items:center; gap:8px; }
.search-input { flex:1; min-width:0; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:14px; color:var(--text); outline:none; transition:border-color .2s; }
.search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
.watchlist-toggle { flex:none; width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:18px; color:var(--muted); cursor:pointer; }
.watchlist-toggle.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
.watchlist-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.list-summary { font-size:12px; color:var(--subtle); }
.list-toggle { width:100%; padding:8px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--accent-strong); font-size:12px; font-weight:700; cursor:pointer; }
.list-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.list-scroll { display:flex; flex-direction:column; gap:8px; min-height:0; overflow-y:auto; padding-right:4px; }
@media(max-width:1024px){ .main { grid-template-columns:1fr; } .list-panel { position:static; max-height:none; } .list-scroll { max-height:240px; } }
.token-btn { display:flex; flex-shrink:0; justify-content:space-between; align-items:center; gap:12px; width:100%; min-height:52px; padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); cursor:pointer; font-size:14px; color:var(--text); transition:background .15s,border-color .15s; text-align:left; }
.token-btn:hover { position:relative; z-index:1; border-color:var(--accent); background:var(--accent-soft); }
.token-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.token-btn.selected { border-color:var(--accent-strong); background:var(--accent-soft); box-shadow:var(--shadow-card); }
.token-main { display:flex; flex-direction:column; gap:2px; min-width:0; }
.token-btn .sym { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.token-age { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.token-btn .sym small { font-weight:400; color:var(--muted); margin-left:6px; font-size:12px; }
.score-tooltip { position:fixed; z-index:100; width:max-content; max-width:min(250px,calc(100vw - 16px)); padding:8px 10px; border-radius:8px; background:var(--text); color:var(--panel); font-size:12px; line-height:1.5; white-space:normal; text-align:left; box-shadow:0 8px 24px rgba(17,24,39,.18); pointer-events:none; }
.score-tooltip[hidden] { display:none; }
.tag-high { background:rgba(15,118,110,.12); color:var(--accent); }
.tag-mid { background:rgba(180,83,9,.12); color:var(--risk); }
.tag-low { background:rgba(239,68,68,.10); color:var(--danger); }

/* ============ RIGHT: Detail ============ */
.detail-panel { display:flex; flex-direction:column; gap:12px; min-width:0; }
.advanced-data { border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:0 16px; }
.advanced-data > summary, .factor-details > summary { cursor:pointer; color:var(--accent-strong); font-weight:700; }
.advanced-data > summary { padding:13px 0; }
.advanced-data[open] { padding-bottom:12px; }
.detail-panel > .advanced-data { margin-top:0; }
.advanced-data > .detail-section { margin-top:12px; }
.factor-details { margin-top:12px; }
.factor-details > summary { font-size:12px; }
.factor-details .factor-grid { margin-top:12px; }
.quiet-warning { color:var(--muted); font-size:13px; }
.detail-section { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 20px; }
.structure-section { container-type:inline-size; }
.detail-section.oi-empty { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 16px; padding:12px 20px; }
.oi-empty .section-header { margin-bottom:0; }
.oi-empty .section-copy { display:none; }
.section-header { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 12px; margin-bottom:12px; }
.section-heading { font-size:16px; font-weight:750; }
.section-address { min-width:0; flex:0 1 auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.detail-section:first-child .section-heading { font-size:20px; }
.section-meta { display:flex; align-items:baseline; justify-content:flex-end; gap:10px; margin-left:auto; min-width:0; }
.section-copy { font-size:13px; color:var(--muted); text-align:right; }
.section-time { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.section-header > .section-time { margin-left:auto; }
.watch-button { flex:none; padding:4px 9px; border:1px solid var(--line); border-radius:999px; background:var(--panel); font-size:12px; color:var(--muted); cursor:pointer; }
.watch-button.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
.transfer-header { margin-bottom:8px; }
.overview-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px 16px; }
.trade-summary { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin:-2px 0 14px; padding:10px 12px; border:1px solid var(--line-strong); border-radius:12px; background:var(--accent-soft); font-size:12px; color:var(--text); }
.trade-summary strong { font-weight:800; }
.trade-summary span { color:var(--muted); }
.trade-summary span b { color:var(--text); font-weight:700; }
.overview-item { min-width:0; }
.overview-item .label { display:block; color:var(--muted); font-size:12px; font-weight:650; }
.overview-item .value { display:block; margin-top:3px; font-size:18px; font-weight:750; line-height:1.25; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
.overview-item .note { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
.overview-item.risk .value { color:var(--risk); }
.overview-item.risk.clear .value { color:var(--accent-strong); }
.structure-card { display:grid; gap:12px; margin:-8px 0 16px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:rgba(15,118,110,.025); }
.structure-section .structure-card { margin:0; padding:0; border:0; background:transparent; }
.structure-section .section-header { margin-bottom:10px; }
.early-warning-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; padding:14px; border:1px solid var(--line); border-radius:11px; background:rgba(15,118,110,.035); }
.early-warning-strip.active { border-color:rgba(15,118,110,.35); background:rgba(15,118,110,.075); }
.early-warning-main,.early-warning-cost,.confirmation-criteria { grid-column:1/-1; min-width:0; }
.early-warning-label { font-size:13px; font-weight:800; color:var(--accent-strong); }
.early-warning-meta { margin-top:3px; font-size:12px; color:var(--muted); }
.early-warning-strip > .early-warning-meta { grid-column:1/-1; }
.early-warning-note { margin-top:8px; font-size:12px; color:var(--muted); line-height:1.45; }
.early-warning-note b { color:var(--text); }
.early-warning-metric { min-width:0; }
.early-warning-metric span { display:block; font-size:11px; color:var(--muted); white-space:nowrap; }
.early-warning-metric b { display:block; margin-top:2px; font-size:14px; color:var(--text); font-variant-numeric:tabular-nums; }
.early-warning-cost { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 16px; padding-top:10px; border-top:1px solid var(--line); }
.early-warning-cost-item { display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 8px; min-width:0; font-size:12px; color:var(--muted); }
.early-warning-cost-item b { font-size:14px; color:var(--text); font-variant-numeric:tabular-nums; }
.early-warning-cost-item.over b,.early-warning-cost-item.over em { color:#a43f30; }
.early-warning-cost-item em { font-style:normal; }
.early-warning-evidence { font-size:12px; color:var(--muted); line-height:1.45; }
.early-warning-evidence b { color:var(--text); }
.confirmation-criteria { font-size:12px; color:var(--muted); }
.confirmation-criteria summary { width:max-content; max-width:100%; cursor:pointer; color:var(--accent-strong); font-weight:700; }
.confirmation-criteria summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.confirmation-checks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 16px; margin-top:8px; border-top:1px solid var(--line); }
.confirmation-check { display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); }
.confirmation-check span { min-width:0; }
.confirmation-check b { min-width:0; color:var(--text); font-weight:650; font-variant-numeric:tabular-nums; text-align:right; overflow-wrap:anywhere; }
.confirmation-check.blocked b { color:#a43f30; }
@container (max-width:520px){ .early-warning-strip { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@container (max-width:520px){ .early-warning-cost,.confirmation-checks { grid-template-columns:1fr; } }
.factor-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.factor-item { min-width:0; }
.factor-label { display:flex; justify-content:space-between; gap:6px; font-size:12px; color:var(--muted); }
.factor-value { margin-top:3px; font-size:16px; font-weight:750; font-variant-numeric:tabular-nums; }
.factor-value.strong { color:var(--accent); }
.factor-value.weak { color:var(--danger); }
.factor-bar { height:3px; margin-top:6px; border-radius:999px; background:rgba(107,114,128,.14); overflow:hidden; }
.factor-bar span { display:block; height:100%; border-radius:inherit; }
.factor-bar .strong { background:var(--accent); }
.factor-bar .weak { background:var(--danger); }
.factor-bar .neutral { background:var(--muted); }
.detail-section .hint { font-size:12px; line-height:1.45; color:#64748b; }
@media(max-width:820px){ .factor-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media(max-width:600px){ .factor-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .early-warning-strip { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.secondary-metrics { display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12px; color:var(--muted); }
.secondary-metrics b { color:var(--text); }
.detail-panel details { margin-top:12px; font-size:12px; color:var(--muted); }
.detail-panel summary { cursor:pointer; }

/* Metric cards */
.metric-card { min-width:0; padding:0 14px; border-right:1px solid var(--line); }
.oi-main .metric-card:first-child { padding-left:0; }
.oi-main .metric-card:last-child { border-right:0; }
.metric-card .label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.metric-card .value { font-size:20px; font-weight:800; margin-top:4px; letter-spacing:-.3px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
.metric-card .note { font-size:12px; color:#64748b; margin-top:4px; }
.metric-card.tone-accent .value { color:var(--accent); }
.metric-card.tone-risk .value { color:var(--risk); }
.metric-card.tone-danger .value { color:var(--danger); }
.oi-main { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); margin:8px 0 12px; }
.oi-meta { display:flex; flex-wrap:wrap; gap:10px 28px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
.oi-meta b { display:block; margin-top:3px; font-size:15px; color:var(--text); }
.oi-breakdown { margin-top:12px; }
.oi-footnote { margin-top:10px; }
@media(max-width:1100px){ .overview-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media(max-width:700px){ .overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:600px){ .oi-main { grid-template-columns:1fr; row-gap:12px; } .oi-main .metric-card { padding-left:0; border-right:0; } .main { padding:16px 14px 32px; } .detail-section { padding:14px; } .overview-grid { grid-template-columns:1fr; } }


/* Charts */
.chart-card { padding:8px 0 0; }
.chart-card h4 { font-size:13px; font-weight:700; margin-bottom:6px; }
svg.chart { width:100%; height:96px; display:block; }
.price-legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:8px; font-size:12px; }
.price-legend span { color:var(--muted); }
.price-legend b { color:var(--text); }
svg.chart.price-chart { height:104px; }
.price-plot { display:grid; grid-template-columns:minmax(0,1fr) max-content; gap:10px; }
.price-visual { min-width:0; }
.price-scale { display:flex; flex-direction:column; justify-content:space-between; padding-bottom:18px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; text-align:right; }
.chart-axis { display:flex; justify-content:space-between; margin-top:4px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.volume-mini { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
.volume-mini svg.chart { height:50px; }
.depth-scroll { overflow-x:auto; }
#earlyHistoryBody { overflow-x:auto; }
.depth-grid { display:grid; grid-template-columns:minmax(76px,.45fr) repeat(2,minmax(0,1fr)); min-width:560px; gap:0; font-size:12px; }
.depth-grid > div { padding:7px 5px; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
.depth-grid > div:nth-child(3n+2) { color:var(--accent); }
.depth-grid > div:nth-child(3n) { color:var(--risk); }
.depth-grid strong { display:block; font-size:14px; font-variant-numeric:tabular-nums; }
.depth-grid small { display:block; margin-top:2px; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.whale-row { display:flex; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:12px; }
.whale-row a { color:var(--accent); text-decoration:none; }
.whale-row .whale-time { margin-left:auto; color:var(--muted); }
.trade-buy { color:var(--accent); }
.trade-sell { color:#b91c1c; }
.secondary-metrics .trade-buy b, .secondary-metrics .trade-sell b { color:inherit; }
.activity-empty { padding:4px 0; font-size:12px; color:var(--muted); }
.detail-panel details.data-note { margin-top:4px; }
.transfer-panel { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.transfer-row { flex-wrap:wrap; }

.empty-state { text-align:center; padding:60px; color:var(--subtle); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand-lockup">
    <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Alpha 雷达标识">
      <rect width="64" height="64" rx="15" fill="#0b5f59"/>
      <path d="M15 39a17 17 0 0 1 34 0" fill="none" stroke="#a7d8d0" stroke-width="4" stroke-linecap="round" opacity=".72"/>
      <path d="M22 46 34 18 46 46" fill="none" stroke="#fffefa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 37h14" stroke="#fffefa" stroke-width="6" stroke-linecap="round"/>
      <circle cx="49" cy="19" r="5" fill="#d97706"/>
    </svg>
    <div>
      <div class="toolbar-title">Alpha 雷达</div>
      <div class="toolbar-subtitle">BSC 代币 · 池子深度 · 合约持仓 · 链上动向</div>
    </div>
  </div>
  <div class="top-right">
    <div class="token-count" id="tokenCount">统计中...</div>
    <div class="refresh-badge"><span class="refresh-dot"></span><span id="refreshInfo">加载中...</span></div>
    <button class="notify-toggle" id="historyToggle" type="button">近期验证</button>
    <button class="notify-toggle" id="notifyToggle" type="button">自选提醒</button>
  </div>
</div>

<div class="main">
  <div class="list-panel">
    <div class="section-title">实时发现</div>
    <div class="filter-row">
      <input class="search-input" id="search" placeholder="按代币符号、名称、地址筛选">
      <button class="watchlist-toggle" id="watchlistToggle" type="button" aria-label="只看自选" aria-pressed="false" title="只看自选">☆</button>
    </div>
    <div class="list-scroll" id="tokenList"><div class="empty-state">正在加载代币数据...</div></div>
    <button class="list-toggle" id="allTokensToggle" type="button" aria-expanded="false">全部监控</button>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="empty-state">名单加载完成后将显示代币详情</div>
  </div>
</div>
<div id="scoreTooltip" class="score-tooltip" role="tooltip" hidden></div>
<div class="history-panel" id="earlyHistoryPanel" hidden>
  <div class="section-header">
    <span class="section-heading">近期验证</span>
    <div class="section-meta"><span class="section-copy">最新回放</span><button class="watch-button" id="earlyHistoryClose" type="button">关闭</button></div>
  </div>
  <div id="earlyHistoryBody"><div class="hint">加载历史回放...</div></div>
</div>

<script>
const REFRESH_MS = 15000;
const OVERVIEW_CACHE_KEY = 'tmm-tokens-v1';
const WATCHLIST_KEY = 'tmm-watchlist-v1';
const WATCHLIST_ONLY_KEY = 'tmm-watchlist-only-v1';
const EARLY_WARNING_NOTIFY_KEY = 'tmm-early-warning-notifications-v1';
let allData = [];
let tokenData = [];
let selectedDetail = null;
let selectedToken = null;
let renderedKey = '';
let searchTerm = '';
let showAllTokens = false;
let userSelected = false;
let earlyWarningLoaded = false;
let watchlistOnly = ['1','true'].includes(localStorage.getItem(WATCHLIST_ONLY_KEY));
let watchlist = new Set(JSON.parse(localStorage.getItem(WATCHLIST_KEY) || '[]'));
let signalV2Rows = new Map();
let marketRegime = null;
let structureRows = new Map();
let earlyWarningRows = new Map();
let earlyWarningCalibration = null;
let structureRefreshPromise = null;
const oiCache = new Map();
const depthCache = new Map();
const whaleCache = new Map();
const transferCache = new Map();
const detailCache = new Map();
const whaleFlowCache = new Map();

function saveWatchlist() {
  localStorage.setItem(WATCHLIST_KEY, JSON.stringify([...watchlist]));
}

function toggleWatchlist(token) {
  const key = String(token || '').toLowerCase();
  if (!key) return;
  const active = watchlist.has(key);
  if (active) watchlist.delete(key);
  else watchlist.add(key);
  saveWatchlist();
  const button = document.getElementById('watchButton');
  if (button) {
    button.classList.toggle('active', !active);

function v2TipText(state){

function mergeTokens(rows) {
  const groups=new Map();
  for(const row of rows){
    const key=(row.token_address||'').toLowerCase();
    if(!key)continue;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(row);
  }
  return [...groups].map(([key,rows])=>{
    rows.sort((a,b)=>(b.liquidity_usd||0)-(a.liquidity_usd||0));
    const pools=rows;
    const main=pools[0], weight=pools.reduce((n,p)=>n+(p.liquidity_usd||0),0);
    const scored=pools.reduce((best,p)=>scoreOf(p)>scoreOf(best)?p:best,main);
    const weighted=field=>weight? pools.reduce((n,p)=>n+(p[field]||0)*(p.liquidity_usd||0),0)/weight:main[field];
    const sum=field=>pools.reduce((n,p)=>n+(p[field]||0),0);
    return {...main, token_address:key, pools, indicator_score:scoreOf(scored), indicator_reasons:scored.short_momentum_score!=null?(scored.prediction_reasons||scored.signal_reasons):scored.signal_reasons, short_signal_stale:scored.short_signal_stale,
      price_usd:weighted('price_usd'), price_change_m5:weighted('price_change_m5'),
      price_change_h1:weighted('price_change_h1'), price_change_h24:weighted('price_change_h24'),
      liquidity_usd:weight, volume_m5:sum('volume_m5'), volume_h1:sum('volume_h1'),
      buys_h1:sum('buys_h1'), sells_h1:sum('sells_h1')};
  }).sort((a,b)=>b.indicator_score-a.indicator_score);
}

function makeChart(points,color='#0f766e') {
  const h=96,w=400;
  const vals=points.map(p=>p.v).filter(v=>v!=null&&!isNaN(v));
  if(vals.length<2)return'<div class="hint">数据不足</div>';
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const step=w/(points.length-1);
  const path=points.map((p,i)=>{const x=i*step,y=h-10-((p.v-min)/range)*(h-20);return`${x.toFixed(1)},${y.toFixed(1)}`}).join(' ');
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="0,${h} ${path} ${w},${h}" fill="${color}" opacity="0.06"/>
    <polyline points="${path}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function makeMarketChart(pool, markets) {
  if(pool.length<2)return '<div class="hint">价格历史不足</div>';
  const start=pool[0].at,end=pool[pool.length-1].at,span=end-start||1;
  const lines=[
    {name:'池子',color:'#0f766e',points:pool},
    {name:'合约标记价',color:'#b45309',points:markets?.futures||[]}
  ].map(line=>({...line,points:line.points.filter(p=>p.at>=start&&p.at<=end&&Number.isFinite(p.price)&&p.price>0)}))
    .filter(line=>line.name==='池子'||line.points.length>=2);
  const values=lines.flatMap(line=>line.points.map(p=>p.price));
  if(values.length<2)return '<div class="hint">价格历史不足</div>';
  const min=Math.min(...values),max=Math.max(...values),range=max-min||min*.001;
  const paths=lines.filter(line=>line.points.length>=2).map(line=>{
    const points=line.points.map(p=>`${((p.at-start)/span*400).toFixed(1)},${(102-((p.price-min)/range)*92).toFixed(1)}`).join(' ');
    return `<polyline points="${points}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round"/>`;
  }).join('');
  const legend=lines.map(line=>`<span><span style="color:${line.color}">●</span> <b>${line.name}</b> ${line.points.length?fmtPrice(line.points.at(-1).price):'暂无匹配'}</span>`).join('');
  const time=at=>new Date(at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  return `<div class="price-legend">${legend}</div><div class="price-plot"><div class="price-visual"><svg class="chart price-chart" viewBox="0 0 400 112" preserveAspectRatio="none">${paths}</svg><div class="chart-axis"><span>${time(start)}</span><span>${time(end)}</span></div></div><div class="price-scale"><span>${fmtPrice(max)}</span><span>${fmtPrice(min)}</span></div></div>`;
}

async function loadTransfers(token) {
  const pair=token.pair_address;
  let cached=transferCache.get(pair);
  if(!cached||Date.now()>=cached.expires){
    cached={expires:Date.now()+60000,promise:fetchReady(`/api/token/${pair}/transfers`).catch(e=>({available:false,reason:e.message})).then(value=>{
      cached.expires=value.available?(Date.parse(value.calculated_at)||Date.now())+120000:Date.now()+60000;
      return value;
    })};
    transferCache.set(pair,cached);
  }
  const result=await cached.promise;
  if(selectedToken!==token.token_address)return;
  const body=document.getElementById('transferBody');
  setSectionTime('transferTime',result.calculated_at);
  if(!result.available){body.innerHTML=`<div class="hint">大额转账暂不可用：${result.reason||'数据源请求失败'}</div>`;return;}
  const poolAddresses=new Set(token.pools.map(p=>p.pair_address.toLowerCase()));
  const transfers=(result.transfers||[]).filter(x=>!poolAddresses.has(x.from.toLowerCase())&&!poolAddresses.has(x.to.toLowerCase()));
  if(!transfers.length){
    body.innerHTML=`<div class="activity-empty">大额转账 0 笔 · 最近 ${result.sample_count||0} 笔样本未发现单笔超过 100 万 ${escapeAttr(token.token_symbol)}</div>
      <details class="data-note"><summary>转账样本与统计口径</summary><div class="hint">${updatedAt(result.calculated_at)}${result.stale?' · 刷新失败，沿用上次结果':''}；仅显示近 24 小时记录；可能包含合约地址，高频代币可能遗漏更早记录。</div></details>`;
    return;
  }
  const short=address=>`${address.slice(0,6)}…${address.slice(-4)}`;
  const wasOpen=body.querySelector?.('details')?.open;
  body.innerHTML=`<div class="secondary-metrics"><span>大额转账 <b>${transfers.length} 笔</b></span><span>单笔 &gt; 100 万 ${escapeAttr(token.token_symbol)}</span></div>
    <details><summary>查看 A → B 转账</summary>${transfers.slice(0,8).map(x=>`<div class="whale-row transfer-row"><b>${Number(x.amount).toLocaleString('en-US',{maximumFractionDigits:2})}</b><span>≈ ${fmtUsd(Number(x.amount)*token.price_usd)}</span><span>${short(x.from)} → ${short(x.to)}</span><a href="https://bscscan.com/tx/${x.hash}" target="_blank" rel="noopener noreferrer">交易</a><span class="whale-time">${timeAgo(x.at)}</span></div>`).join('')}</details>
    <div class="hint" style="margin-top:8px">${updatedAt(result.calculated_at)}${result.stale?' · 刷新失败，沿用上次结果':''}；最近 ${result.sample_count||0} 笔链上转账中仅显示近 24 小时记录；美元价值按当前价格估算；可能包含合约地址，高频代币可能遗漏更早记录。</div>`;
  if(wasOpen)body.querySelector('details').open=true;
}

async function loadWhales(token) {
  const results=Array(token.pools.length);
  const key=renderedKey;
  const show=()=>{
    if(selectedToken!==token.token_address||renderedKey!==key)return;
    const body=document.getElementById('whaleBody');
    const done=results.filter(Boolean).length, pending=done<token.pools.length;
    const available=results.filter(x=>x?.available);
    const totalLiquidity=token.pools.reduce((sum,pool)=>sum+Math.max(0,Number(pool.liquidity_usd)||0),0);
    const coveredLiquidity=token.pools.reduce((sum,pool,i)=>sum+(results[i]?.available?Math.max(0,Number(pool.liquidity_usd)||0):0),0);
    const liquidityCoverage=totalLiquidity>0?coveredLiquidity/totalLiquidity:0;
    const coverage=totalLiquidity>0?`覆盖流动性 ${Math.round(coveredLiquidity/totalLiquidity*100)}%`:'覆盖流动性未知';
    setSectionTime('whaleTime',latestTime(available),pending?'更新中…':'更新时间未知');
    if(!available.length){
      whaleFlowCache.set(String(token.token_address||'').toLowerCase(),{netUsd:null});
      const flowValue=document.getElementById('whaleFlowValue');
      if(flowValue)flowValue.textContent='--';
      body.innerHTML=`<div class="hint">${pending?`已查询 ${done}/${token.pools.length} 个池子 · ${coverage} · 其余获取中...`
        :results.some(x=>String(x.reason||'').includes('限流'))?'交易数据源限流，稍后自动重试'
        :'大额交易数据暂不可用，稍后自动重试'}</div>`;
      return;
    }
    const old=available.some(x=>{const at=Date.parse(x.calculated_at);return !Number.isFinite(at)||Date.now()-at>300000;});
    const partial=pending||available.length<token.pools.length||old;
    const note=`池子 ${available.length}/${token.pools.length} · ${coverage} · ${poolUpdatedAt(available)}${old?' · 数据已过期':''}${available.some(x=>x.stale)?' · 部分池子刷新失败，沿用上次结果':''}${pending?` · 已查询 ${done}/${token.pools.length} 个池子，其余获取中`:available.length<token.pools.length?' · 部分池子暂不可用':''}${partial?' · 部分样本：仅代表已覆盖池子及所示时间':''} · `;
    const byHash=new Map();
    for(const result of available)for(const trade of result.trades||[]){
      const previous=byHash.get(trade.hash);
      if(!previous||trade.usd>previous.usd)byHash.set(trade.hash,trade);
    }
    const trades=[...byHash.values()].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at));
    const recentTrades=trades.filter(x=>Date.now()-Date.parse(x.at)<=3600000);
    const buys=recentTrades.filter(x=>x.side==='buy'),sells=recentTrades.filter(x=>x.side==='sell');
    const sum=rows=>rows.reduce((n,x)=>n+x.usd,0);
    const netUsd=sum(buys)-sum(sells);
    const flowReady=!pending&&available.length>0&&(totalLiquidity===0?available.length===token.pools.length:liquidityCoverage>=.95);
    whaleFlowCache.set(String(token.token_address||'').toLowerCase(),{netUsd:flowReady?netUsd:null,buyUsd:flowReady?sum(buys):null,sellUsd:flowReady?sum(sells):null,buyCount:flowReady?buys.length:null,sellCount:flowReady?sells.length:null,at:latestTime(available)});

function poolDepthAtTarget(pool,depth,target,field){
  const spot=Number(pool.price_usd);
  if(!Number.isFinite(spot)||spot<=0||!Number.isFinite(target)||target<=0)return null;
  const pct=(field==='support_usd'?1-target/spot:target/spot-1)*100;
  if(pct<=0)return 0;
  const bands=depth.bands_pct||[],amounts=depth[field]||[];
  let prevPct=0,prevAmount=0;
  for(let i=0;i<bands.length;i++){
    const band=Number(bands[i]),amount=amounts[i];
    if(!Number.isFinite(band)||band<=prevPct||!Number.isFinite(amount)||amount<prevAmount)return null;
    if(pct<=band+1e-8)return prevAmount+(amount-prevAmount)*Math.min(1,(pct-prevPct)/(band-prevPct));
    prevPct=band;prevAmount=amount;
  }
  return null;
}

async function loadDepth(token) {
  const eligible=token.pools.filter(pool=>Number(pool.liquidity_usd)>=10&&Number(pool.price_usd)>0).sort((a,b)=>Number(b.liquidity_usd)-Number(a.liquidity_usd));
  const totalLiquidity=eligible.reduce((sum,pool)=>sum+Number(pool.liquidity_usd),0);
  let includedLiquidity=0;
  const pools=eligible.filter(pool=>{if(includedLiquidity>=totalLiquidity*.95)return false;includedLiquidity+=Number(pool.liquidity_usd);return true;});
  const results=Array(pools.length);
  const key=renderedKey;
  const show=()=>{
  if(selectedToken!==token.token_address||renderedKey!==key)return;
  const body=document.getElementById('depthBody');
  const done=results.filter(Boolean).length, pending=done<pools.length;
  const available=results.filter(x=>x?.depth.available);
  setSectionTime('depthTime',latestTime(available.map(x=>x.depth)),pending?'更新中…':'更新时间未知');
  if(!available.length){body.innerHTML=`<div class="hint">${!pools.length?'暂无有价格及流动性的池子':pending?`已查询 ${done}/${pools.length} 个池子，其余获取中...`:'区间深度暂不可用：池子报价失败'}</div>`;return;}
  const recent=available.filter(({depth})=>{const age=Date.now()-Date.parse(depth.calculated_at);return !depth.stale&&Number.isFinite(age)&&age>=0&&age<=300000;});
  const recentLiquidity=recent.reduce((sum,{pool})=>sum+Math.max(0,Number(pool.liquidity_usd)||0),0);
  const freshCoverage=totalLiquidity>0?`近5分钟覆盖流动性 ${Math.round(recentLiquidity/totalLiquidity*100)}%`:'近5分钟覆盖流动性未知';
  const bands=[1,2,5,10,15,20], price=token.price_usd;
  const sumDepth=(field,target)=>{
    const values=available.map(({pool,depth})=>poolDepthAtTarget(pool,depth,target,field));
    return values.some(v=>v==null)?null:values.reduce((n,v)=>n+v,0);
  };
  const rows=(start,end)=>bands.slice(start,end).map(pct=>{const down=price*(1-pct/100),up=price*(1+pct/100);return `<div>${pct}%</div><div><strong>${fmtMoney(sumDepth('support_usd',down))}</strong><small>目标价 ${fmtPrice(down)}</small></div><div><strong>${fmtMoney(sumDepth('pressure_usd',up))}</strong><small>目标价 ${fmtPrice(up)}</small></div>`;}).join('');
  const wasOpen=body.querySelector?.('details')?.open;
  body.innerHTML=`<div class="depth-scroll"><div class="depth-grid"><div>目标涨跌幅</div><div>跌至该幅度需卖出</div><div>涨至该幅度需买入</div>${rows(0,3)}</div></div>
    <details><summary>更多深度 · 10% / 15% / 20%</summary><div class="depth-scroll"><div class="depth-grid"><div>目标涨跌幅</div><div>跌至该幅度需卖出</div><div>涨至该幅度需买入</div>${rows(3,6)}</div></div></details>
    <div class="hint" style="margin-top:8px">池子 ${available.length}/${pools.length} · 纳入流动性约 ${totalLiquidity?Math.floor(includedLiquidity/totalLiquidity*100):0}% · ${freshCoverage} · ${poolUpdatedAt(available.map(x=>x.depth))}${recent.length<available.length?' · 合计含旧数据':''} · ${available.some(x=>x.depth.stale)?'部分池子刷新失败，沿用上次结果 · ':''}各池按同一目标价插值估算后合计；跌 5% 的金额已包含跌 1% 的金额。仅反映当前池内报价，不含跨池最优路由或套利${pending?'；其余获取中':available.length<pools.length?'；部分池子不可用，合计不完整':''}；-- 表示报价不足或待刷新</div>`;
  if(wasOpen)body.querySelector('details').open=true;
  };
  if(!pools.length){show();return;}
  await Promise.all(pools.map(async (pool,i)=>{
    const pair=pool.pair_address;
    let cached=depthCache.get(pair);
    if(!cached||Date.now()>=cached.expires){
      cached={expires:Date.now()+60000,promise:fetchReady(`/api/token/${pair}/depth`).catch(e=>({available:false,reason:e.message})).then(value=>{
        cached.expires=value.available?(Date.parse(value.calculated_at)||Date.now())+120000:Date.now()+60000;
        return value;
      })};
      depthCache.set(pair,cached);
    }
    results[i]={pool,depth:await cached.promise};
    show();
  }));
}

async function loadTrend(token) {
  const key=renderedKey;
  try {
    const histories=(await Promise.all(token.pools.map(p=>fetchJSON(`/api/token/${p.pair_address}/snapshots?limit=36`)))).filter(h=>h.length>=2);
    if(selectedToken!==token.token_address||renderedKey!==key)return;
    // shortcut: worker samples pools sequentially, so same-index recent snapshots approximate the same time; align by timestamp if sampling becomes uneven.
    const count=histories.length?Math.min(...histories.map(h=>h.length)):0;
    const merged=Array.from({length:count},(_,i)=>{
      const samples=histories.map(h=>h[count-1-i]);
      const weight=samples.reduce((n,s)=>n+(s.liquidity_usd||0),0);
      return {at:Date.parse(samples[0].observed_at),price:weight?samples.reduce((n,s)=>n+(s.price_usd||0)*(s.liquidity_usd||0),0)/weight:null,
        volume:samples.reduce((n,s)=>n+(s.volume_h1||0),0)};
    });
    const show=markets=>{if(selectedToken===token.token_address&&renderedKey===key){
      setSectionTime('trendTime',merged.at(-1)?.at?new Date(merged.at(-1).at).toISOString():null);
      document.getElementById('trendBody').innerHTML=`<div class="chart-card">${makeMarketChart(merged,markets)}
        <div class="volume-mini"><h4>1 小时成交额走势 · ${fmtMoney(merged.at(-1)?.volume)}</h4>${makeChart(merged.map(x=>({v:x.volume})),'#64748b')}</div></div>
        <div class="hint" style="margin-top:8px">池子按流动性加权；合约来自 Binance 同名 USDT 市场，按符号和价格近似匹配，仍可能误配。各池快照时间略有偏差。</div>`;
    }};
    show(null);
    show(await fetchReady(`/api/token/${token.pools[0].pair_address}/prices`).catch(()=>({})));
  }catch(e){
    if(selectedToken!==token.token_address||renderedKey!==key)return;
    setSectionTime('trendTime',null);
    document.getElementById('trendBody').innerHTML=`<div class="hint">走势加载失败: ${e.message}</div>`;
  }
}

function notifyEarlyWarnings(){
  updateNotifyToggle();
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  let sent={};
  try{sent=JSON.parse(localStorage.getItem(EARLY_WARNING_NOTIFY_KEY)||'{}');}catch{}
  const now=Date.now();
  const symbols=new Map(tokenData.map(token=>[String(token.token_address||'').toLowerCase(),token.token_symbol||token.token_name||token.token_address]));
  for(const warning of earlyWarningRows.values()){
    if(!warning.is_active||!watchlist.has(String(warning.token_address||'').toLowerCase()))continue;
    const confirmation=confirmationState({token_address:warning.token_address});
    if(!confirmation.active)continue;
    const key=String(warning.token_address||'').toLowerCase()+':'+signalV2Rows.get(String(warning.token_address||'').toLowerCase())?.first_seen_at;
    if(Number.isFinite(sent[key]))continue;
    sent[key]=now;
    const symbol=symbols.get(String(warning.token_address||'').toLowerCase())||'代币';
    const acceleration=Number(warning.volume_acceleration);
    const pressure=Number(warning.buy_pressure);
    const slippage1000=Number((warning.slippage_estimates?.estimates||[]).find(row=>Number(row.order_usd)===1000)?.buy_slippage_pct);
    const age=confirmation.label.split(' · ')[1]||'--';
    new Notification(`${symbol} ${confirmation.label}`,{
      body:`A 年龄：${age} · 量能：${Number.isFinite(acceleration)?acceleration.toFixed(1)+'x':'--'} · 买压：${Number.isFinite(pressure)?Math.round(pressure*100)+'%':'--'} · $1K滑点：${Number.isFinite(slippage1000)?slippage1000.toFixed(2)+'%':'--'} · 预测观察，不是买入指令`,
      tag:key
    });
  }
  for(const [key,at] of Object.entries(sent))if(!Number.isFinite(at)||now-at>7*86400000)delete sent[key];
  try{localStorage.setItem(EARLY_WARNING_NOTIFY_KEY,JSON.stringify(sent));}catch{}
}

function fmtSignedPct(value){return value==null||isNaN(value)?'--':`${value>0?'+':''}${value.toFixed(2)}%`;}
function fmtDuration(seconds){
  if(seconds==null||!Number.isFinite(seconds))return '--';
  if(seconds<60)return`${Math.round(seconds)}秒`;
  if(seconds<3600)return`${Math.round(seconds/60)}分钟`;
  return`${(seconds/3600).toFixed(1)}小时`;
}

  const panel=document.getElementById('earlyHistoryPanel');
  if(!panel)return;
  const open=force===true?true:force===false?false:panel.hidden!==false;
  panel.hidden=!open;
  if(!open)return;
  const body=document.getElementById('earlyHistoryBody');
  try{
    const [result,market]=await Promise.all([
      fetchJSON('/api/early-warning/history?limit=1'),
      fetchJSON('/api/market-state').catch(()=>null)
    ]);
    body.innerHTML=marketStateHTML(market)+earlyHistoryHTML(result);
  }catch(e){
    body.innerHTML=`<div class="hint">历史回放加载失败：${escapeAttr(e.message)}</div>`;
  }
}

async function refresh(){
  try{
    const [rows, signalV2, market] = await Promise.all([
      fetchJSON('/api/tokens'),
      fetchJSON('/api/signal-v2?limit=50').catch(()=>({summaries:[]})),
      fetchJSON('/api/market-state').catch(()=>null)
    ]);
    marketRegime=market?.state||null;
    signalV2Rows = new Map((signalV2.summaries||[]).map(state=>[String(state.token_address||'').toLowerCase(),state]));
    showOverview(rows);
    if(selectedToken)renderDetail();
    try{localStorage.setItem(OVERVIEW_CACHE_KEY,JSON.stringify({at:Date.now(),rows}));}catch{}
    refreshStructure();
    refreshEarlyWarning();
  }catch(e){
    document.getElementById('refreshInfo').textContent=`更新失败: ${e.message}`;
    if(!tokenData.length){
      document.getElementById('tokenList').innerHTML='<div class="empty-state">加载失败，稍后自动重试</div>';
    }
  }
}
refresh();
setInterval(refresh,REFRESH_MS);
</script>
</body>
</html>
